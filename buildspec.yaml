version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 329599637147.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - docker build -t prediction-system .
      - docker tag prediction-system:latest 329599637147.dkr.ecr.us-east-1.amazonaws.com/prediction-system:latest
  post_build:
    commands:
      - docker push 329599637147.dkr.ecr.us-east-1.amazonaws.com/prediction-system:latest
      - echo Writing image definitions file...
      - printf '[{"name":"prediction-system","imageUri":"%s"}]' 329599637147.dkr.ecr.us-east-1.amazonaws.com/prediction-system:latest > imagedefinitions.json   
artifacts:
  files: 
  - imagedefinitions.json